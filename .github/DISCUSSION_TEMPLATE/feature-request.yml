labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        # Feature Request
        Thanks for proposing an idea. The details below help us evaluate impact, scope, and fit.
  - type: textarea
    attributes:
      label: Feature Summary
      description: What would you like to see added or changed?
      placeholder: Add a sleep timer that fades out audio over the last 30 seconds.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? Who benefits?
      placeholder: I fall asleep to audiobooks and need a timer to avoid losing my place.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe how you imagine this working in the app.
      placeholder: A timer button on the player screen with preset durations and a custom option.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any workarounds or other approaches you considered?
      placeholder: I currently use iOS's built-in sleep timer via Clock, but it stops all audio.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Similar Apps or References
      description: Links or screenshots from other apps that do this well.
      placeholder: "Audible's sleep timer UI: https://example.com/screenshot"
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Priority
      description: How important is this to you?
      options:
        - Nice to have
        - Important
        - Critical for my use
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Frequency
      description: How often would you use this feature?
      options:
        - Daily
        - Weekly
        - Occasionally
        - Rarely
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing Discussions and Issues to avoid duplicates.
          required: true
